[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-rl-compact"
version = "0.1.0"
description = "RL compact logprobs for /inference/v1/generate (vLLM endpoint plugin)"
requires-python = ">=3.10"
# Needs the core APIs listed in the README (no released vLLM has them yet).
dependencies = ["vllm", "pybase64", "numpy"]

[project.entry-points."vllm.endpoint_plugins"]
rl_compact = "vllm_rl_compact:RLCompactPlugin"

[tool.setuptools]
packages = ["vllm_rl_compact"]
