[package]
name = "genopt-client3"
version = "0.1.0"
edition = "2021"
description = "Native measurement client v3 for the genopt /inference/v1/generate abort cohort (not product code)"
publish = false

[[bin]]
name = "genopt-client3"
path = "src/main.rs"

[dependencies]
sha2 = "0.11"
base64 = "0.22"
serde_json = "1"
libc = "0.2"
memchr = "2"
ring = "0.17"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
